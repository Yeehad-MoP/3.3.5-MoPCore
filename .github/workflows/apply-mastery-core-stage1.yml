name: Apply Mastery Core Stage 1

on:
  push:
    branches:
      - feature/mastery-core
    paths:
      - .github/workflows/apply-mastery-core-stage1.yml

permissions:
  contents: write

jobs:
  apply-mastery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mastery branch
        uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Validate Mastery patch
        run: git apply --check patches/mastery-core-stage1.patch

      - name: Apply Mastery patch
        run: git apply patches/mastery-core-stage1.patch

      - name: Validate resulting diff
        run: git diff --check

      - name: Remove temporary patch and workflow
        run: |
          rm patches/mastery-core-stage1.patch
          rm .github/workflows/apply-mastery-core-stage1.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement server-side Mastery rating support"
          git push origin HEAD:feature/mastery-core
