name: Apply MoP Aura 330 Client Cancel Support

on:
  push:
    branches:
      - mop-spell-compat-stage1
    paths:
      - tools/mop_aura330_client_cancel.py
      - .github/workflows/apply-mop-aura330-client-cancel.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mop-spell-compat-stage1
          fetch-depth: 0

      - name: Apply Aura 330 client-cancel patch
        run: python3 tools/mop_aura330_client_cancel.py

      - name: Validate expected changes
        run: |
          grep -q "FindCurrentSpellBySpellId(spellId)" src/server/game/Handlers/SpellHandler.cpp
          grep -q "SPELL_AURA_CAST_WHILE_WALKING, currentSpell->m_spellInfo" src/server/game/Handlers/SpellHandler.cpp

      - name: Commit applied source changes
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/game/Handlers/SpellHandler.cpp
          git commit -m "Ignore 3.3.5 movement cancel packets for Aura 330"
          git push origin HEAD:mop-spell-compat-stage1
