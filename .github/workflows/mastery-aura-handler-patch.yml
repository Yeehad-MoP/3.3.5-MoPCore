name: One-shot Mastery aura handler integration

on:
  push:
    branches:
      - feature/mastery-core
    paths:
      - .github/workflows/mastery-aura-handler-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mastery branch
        uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Patch AuraEffectHandler table
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/server/game/Spells/Auras/SpellAuraEffects.cpp")
          text = path.read_text(encoding="utf-8")
          old = """    &AuraEffect::HandlePreventResurrection,                       //314 SPELL_AURA_PREVENT_RESURRECTION todo\n    &AuraEffect::HandleNoImmediateEffect,                         //315 SPELL_AURA_UNDERWATER_WALKING todo\n    &AuraEffect::HandleNoImmediateEffect,                         //316 SPELL_AURA_PERIODIC_HASTE implemented in AuraEffect::CalculatePeriodic\n};"""
          new = """    &AuraEffect::HandlePreventResurrection,                       //314 SPELL_AURA_PREVENT_RESURRECTION todo\n    &AuraEffect::HandleNoImmediateEffect,                         //315 SPELL_AURA_UNDERWATER_WALKING todo\n    &AuraEffect::HandleNoImmediateEffect,                         //316 SPELL_AURA_PERIODIC_HASTE implemented in AuraEffect::CalculatePeriodic\n    &AuraEffect::HandleNoImmediateEffect,                         //317 SPELL_AURA_317 (MoP: SPELL_AURA_MOD_SPELL_POWER_PCT) not implemented yet\n    &AuraEffect::HandleNoImmediateEffect,                         //318 SPELL_AURA_MASTERY evaluated on demand by Mastery helpers\n};"""
          if text.count(old) != 1:
              raise SystemExit(f"Expected one handler-table tail, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workaround = Path("src/server/game/Spells/Auras/MasteryAuraHandler.cpp")
          if not workaround.exists():
              raise SystemExit("MasteryAuraHandler.cpp is missing")
          workaround.unlink()

          workflow = Path(".github/workflows/mastery-aura-handler-patch.yml")
          workflow.unlink()

      - name: Commit direct handler integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Mastery aura handlers directly"
          git push origin HEAD:feature/mastery-core
