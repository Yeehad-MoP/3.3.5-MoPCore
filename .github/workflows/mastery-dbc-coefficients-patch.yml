name: One-shot DBC Mastery coefficient integration
on:
  push:
    branches: [ feature/mastery-core ]
    paths: [ '.github/workflows/mastery-dbc-coefficients-patch.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0
      - name: Integrate converted-DBC Mastery coefficients
        shell: python
        run: |
          from pathlib import Path

          mastery = Path('src/server/game/Entities/Player/Mastery.h')
          text = mastery.read_text()
          anchor = '''    inline bool HasMasterySpecialization(Player const* player, uint32 masterySpell)\n    {\n        return GetMasterySpecializationSpell(player) == masterySpell;\n    }\n'''
          insert = anchor + r'''

    /**
     * The converted 3.3.5 Spell.dbc preserves most MoP Mastery coefficients in
     * dummy/base-point effects, but EffectBonusMultiplier is zero for these
     * spells. Return the per-Mastery-point amount for aura effects that can be
     * handled directly by the existing WotLK aura system.
     *
     * Effects requiring procs, target-health checks, pet ownership, periodic
     * rollover, or resource-state logic remain in spell_mastery.cpp.
     */
    inline float GetConvertedDBCAmountPerMastery(uint32 spellId, uint8 effectIndex)
    {
        switch (spellId)
        {
            case WARRIOR_FURY:
                return effectIndex == EFFECT_1 ? 1.40f : 0.0f;
            case WARRIOR_PROTECTION:
                return (effectIndex == EFFECT_1 || effectIndex == EFFECT_2) ? 1.50f : 0.0f;

            case PALADIN_PROTECTION:
                return (effectIndex == EFFECT_0 || effectIndex == EFFECT_1) ? 1.00f : 0.0f;

            case HUNTER_SURVIVAL:
                return (effectIndex == EFFECT_0 || effectIndex == EFFECT_1) ? 1.00f : 0.0f;

            case ROGUE_ASSASSINATION:
                return (effectIndex == EFFECT_1 || effectIndex == EFFECT_2) ? 3.50f : 0.0f;
            case ROGUE_SUBTLETY:
                return effectIndex < MAX_SPELL_EFFECTS ? 2.50f : 0.0f;

            case PRIEST_DISCIPLINE:
                // MoP Shield Discipline: healing scales at half the absorb rate.
                return effectIndex == EFFECT_0 ? 0.80f : 0.0f;

            case DEATH_KNIGHT_FROST:
                return effectIndex == EFFECT_1 ? 2.00f : 0.0f;
            case DEATH_KNIGHT_UNHOLY:
                return effectIndex == EFFECT_1 ? 2.50f : 0.0f;

            case SHAMAN_ENHANCEMENT:
                return effectIndex == EFFECT_1 ? 2.50f : 0.0f;

            case WARLOCK_AFFLICTION:
                return (effectIndex == EFFECT_0 || effectIndex == EFFECT_1) ? 3.10f : 0.0f;

            case DRUID_BALANCE:
                return effectIndex == EFFECT_1 ? 1.87f : 0.0f;
            case DRUID_FERAL:
                return (effectIndex == EFFECT_1 || effectIndex == EFFECT_2) ? 3.13f : 0.0f;
            case DRUID_GUARDIAN:
                return effectIndex == EFFECT_1 ? 2.00f : 0.0f;
            default:
                return 0.0f;
        }
    }
'''
          if anchor not in text:
              raise SystemExit('Mastery.h anchor not found')
          text = text.replace(anchor, insert, 1)
          mastery.write_text(text)

          aura = Path('src/server/game/Spells/Auras/SpellAuraEffects.cpp')
          text = aura.read_text()
          old = '''    if (Player* player = caster ? caster->ToPlayer() : nullptr;\n        player && Acore::Mastery::IsMasterySpecializationSpell(m_spellInfo->Id) && effect.BonusMultiplier != 0.0f)\n        amount = int32(Acore::Mastery::GetMastery(player) * effect.BonusMultiplier);\n    else\n        amount = effect.CalcValue(caster, &m_baseAmount, nullptr);\n'''
          new = '''    if (Player* player = caster ? caster->ToPlayer() : nullptr; player && Acore::Mastery::IsMasterySpecializationSpell(m_spellInfo->Id))\n    {\n        float convertedDBCAmount = Acore::Mastery::GetConvertedDBCAmountPerMastery(m_spellInfo->Id, m_effIndex);\n        if (convertedDBCAmount != 0.0f)\n            amount = int32(Acore::Mastery::GetMastery(player) * convertedDBCAmount);\n        else if (effect.BonusMultiplier != 0.0f)\n            amount = int32(Acore::Mastery::GetMastery(player) * effect.BonusMultiplier);\n        else\n            amount = effect.CalcValue(caster, &m_baseAmount, nullptr);\n    }\n    else\n        amount = effect.CalcValue(caster, &m_baseAmount, nullptr);\n'''
          if old not in text:
              raise SystemExit('SpellAuraEffects.cpp Mastery calculation anchor not found')
          text = text.replace(old, new, 1)
          aura.write_text(text)
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'GetConvertedDBCAmountPerMastery' src/server/game/Entities/Player/Mastery.h
          grep -q 'convertedDBCAmount' src/server/game/Spells/Auras/SpellAuraEffects.cpp
      - name: Commit coefficient support and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mastery-dbc-coefficients-patch.yml
          git add src/server/game/Entities/Player/Mastery.h src/server/game/Spells/Auras/SpellAuraEffects.cpp
          git commit -m 'Use converted Spell DBC coefficients for Mastery auras'
          git push origin feature/mastery-core
