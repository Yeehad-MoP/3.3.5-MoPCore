name: Final Mastery audit compile

on:
  push:
    branches: [ feature/mastery-core ]
    paths:
      - 'tools/mastery_final_audit_fixes.py'
      - '.github/workflows/mastery-final-audit.yml'

permissions:
  contents: write

jobs:
  mastery-final-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Apply remaining audit corrections
        run: python tools/mastery_final_audit_fixes.py

      - name: Validate final Mastery source
        run: |
          git diff --check
          grep -q 'SynchronizeMasterySpecialization' src/server/game/Entities/Player/Mastery.h
          grep -q 'TALENT_TREE_WARRIOR_ARMS' src/server/game/Entities/Player/Mastery.h
          grep -q 'Acore::Mastery::SynchronizeMasterySpecialization(this)' src/server/game/Entities/Player/Player.cpp
          grep -q 'Acore::Mastery::SynchronizeMasterySpecialization(this)' src/server/game/Entities/Player/PlayerStorage.cpp
          grep -q '1.85f / 100.0f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'GetMastery(player) \* 3.00f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'GetMastery(player) \* 2.00f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'GetMastery(player) \* 1.875f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'CastCustomSpell(player, SPELL_MASTERY_BLOOD_SHIELD' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'case ITEM_MOD_MASTERY_RATING' src/server/game/Entities/Player/PlayerStorage.cpp
          grep -q 'isHunterPet = HasAura(8875)' src/server/game/Entities/Unit/Unit.cpp
          grep -q "102792, 'spell_mastery_harmony_trigger'" data/sql/updates/db_world/2026_09_27_00.sql

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev \
            libmysqlclient-dev libreadline-dev zlib1g-dev libbz2-dev libncurses-dev

      - name: Configure no-PCH audit build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DTOOLS_BUILD=none \
            -DUSE_SCRIPTPCH=OFF \
            -DUSE_COREPCH=OFF \
            -DNOPCH=true \
            -DWITH_WARNINGS=ON

      - name: Compile Mastery-bearing libraries
        run: cmake --build build --target game scripts -j2

      - name: Commit final audited source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            tools/mastery_final_audit_fixes.py \
            tools/mastery_full_audit_fixes.py \
            tools/mastery_runtime_audit_fixes.py \
            .github/workflows/mastery-final-audit.yml \
            .github/workflows/mastery-full-audit.yml \
            .github/workflows/mastery-runtime-audit-fixes.yml \
            .github/workflows/mastery-icicles-compile.yml; do
            if [ -f "$f" ]; then git rm -f "$f"; fi
          done
          git add src/server/game/Entities/Player/Mastery.h \
                  src/server/game/Entities/Player/Player.cpp \
                  src/server/game/Entities/Player/PlayerStorage.cpp \
                  src/server/scripts/Spells/spell_mastery.cpp
          git commit -m 'Complete Mastery compile and runtime audit'
          git push origin feature/mastery-core
