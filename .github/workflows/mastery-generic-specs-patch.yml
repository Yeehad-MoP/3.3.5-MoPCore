name: One-shot generic Mastery specialization integration

on:
  push:
    branches:
      - feature/mastery-core
    paths:
      - .github/workflows/mastery-generic-specs-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mastery branch
        uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Integrate generic Mastery specialization scaling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mastery = Path('src/server/game/Entities/Player/Mastery.h')
          text = mastery.read_text()
          anchor = '''    inline bool IsMasteryAvailable(Player const* player)\n    {\n        return player && player->GetLevel() >= MIN_MASTERY_LEVEL;\n    }\n'''
          helper = '''    inline bool IsMasterySpecializationSpell(uint32 spellId)\n    {\n        switch (spellId)\n        {\n            case WARRIOR_ARMS:\n            case WARRIOR_FURY:\n            case WARRIOR_PROTECTION:\n            case PALADIN_HOLY:\n            case PALADIN_PROTECTION:\n            case PALADIN_RETRIBUTION:\n            case HUNTER_BEAST_MASTERY:\n            case HUNTER_MARKSMANSHIP:\n            case HUNTER_SURVIVAL:\n            case ROGUE_ASSASSINATION:\n            case ROGUE_COMBAT:\n            case ROGUE_SUBTLETY:\n            case PRIEST_DISCIPLINE:\n            case PRIEST_HOLY:\n            case PRIEST_SHADOW:\n            case DEATH_KNIGHT_BLOOD:\n            case DEATH_KNIGHT_FROST:\n            case DEATH_KNIGHT_UNHOLY:\n            case SHAMAN_ELEMENTAL:\n            case SHAMAN_ENHANCEMENT:\n            case SHAMAN_RESTORATION:\n            case MAGE_ARCANE:\n            case MAGE_FIRE:\n            case MAGE_FROST:\n            case WARLOCK_AFFLICTION:\n            case WARLOCK_DEMONOLOGY:\n            case WARLOCK_DESTRUCTION:\n            case DRUID_BALANCE:\n            case DRUID_FERAL:\n            case DRUID_GUARDIAN:\n            case DRUID_RESTORATION:\n                return true;\n            default:\n                return false;\n        }\n    }\n\n''' + anchor
          if anchor not in text:
              raise SystemExit('Mastery.h anchor not found')
          text = text.replace(anchor, helper, 1)
          mastery.write_text(text)

          aura = Path('src/server/game/Spells/Auras/SpellAuraEffects.cpp')
          text = aura.read_text()

          include_anchor = '#include "Log.h"\n#include "ObjectAccessor.h"\n'
          include_replacement = '#include "Log.h"\n#include "Mastery.h"\n#include "ObjectAccessor.h"\n'
          if include_anchor not in text:
              raise SystemExit('SpellAuraEffects.cpp include anchor not found')
          text = text.replace(include_anchor, include_replacement, 1)

          calc_anchor = '''int32 AuraEffect::CalculateAmount(Unit* caster)\n{\n    int32 amount;\n    // default amount calculation\n    amount = m_spellInfo->Effects[m_effIndex].CalcValue(caster, &m_baseAmount, nullptr);\n\n'''
          calc_replacement = '''int32 AuraEffect::CalculateAmount(Unit* caster)\n{\n    int32 amount;\n    SpellEffectInfo const& effect = m_spellInfo->Effects[m_effIndex];\n\n    // MoP specialization Masteries store their per-Mastery-point scaling in\n    // EffectBonusMultiplier. Keep the 3.3.5 client update-field layout intact\n    // and calculate the aura amount from the server-side Mastery value instead.\n    if (Player* player = caster ? caster->ToPlayer() : nullptr;\n        player && Acore::Mastery::IsMasterySpecializationSpell(m_spellInfo->Id) && effect.BonusMultiplier != 0.0f)\n        amount = int32(Acore::Mastery::GetMastery(player) * effect.BonusMultiplier);\n    else\n        amount = effect.CalcValue(caster, &m_baseAmount, nullptr);\n\n'''
          if calc_anchor not in text:
              raise SystemExit('SpellAuraEffects.cpp CalculateAmount anchor not found')
          text = text.replace(calc_anchor, calc_replacement, 1)
          aura.write_text(text)

          assert mastery.read_text().count('inline bool IsMasterySpecializationSpell') == 1
          out = aura.read_text()
          assert out.count('#include "Mastery.h"') == 1
          assert out.count('Acore::Mastery::IsMasterySpecializationSpell') == 1
          assert out.count('effect.BonusMultiplier') == 2
          PY

          git diff --check
          git diff -- src/server/game/Entities/Player/Mastery.h src/server/game/Spells/Auras/SpellAuraEffects.cpp

      - name: Commit generic Mastery support
        shell: bash
        run: |
          rm -f .github/workflows/mastery-generic-specs-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/game/Entities/Player/Mastery.h src/server/game/Spells/Auras/SpellAuraEffects.cpp .github/workflows/mastery-generic-specs-patch.yml
          git commit -m "Implement generic MoP Mastery specialization scaling"
          git push origin HEAD:feature/mastery-core
