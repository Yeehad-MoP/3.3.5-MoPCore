name: One-shot Icicles compile check

on:
  push:
    branches: [ feature/mastery-core ]
    paths: [ '.github/workflows/mastery-icicles-compile.yml' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev \
            libmysqlclient-dev libreadline-dev zlib1g-dev libbz2-dev libncurses-dev

      - name: Configure without PCH
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DTOOLS_BUILD=none \
            -DUSE_SCRIPTPCH=OFF \
            -DUSE_COREPCH=OFF \
            -DNOPCH=true \
            -DWITH_WARNINGS=ON

      - name: Compile worldserver
        run: cmake --build build --target worldserver -j2
