name: One-shot Icicle state synchronization
'on':
  push:
    branches: [ feature/mastery-core ]
    paths: [ '.github/workflows/mastery-icicles-threadsafe.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0
      - name: Harden Icicle state
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server/scripts/Spells/spell_mastery_icicles.cpp')
          s = p.read_text()

          s = s.replace('#include <map>\n', '#include <map>\n#include <mutex>\n', 1)
          s = s.replace('    std::map<ObjectGuid, std::deque<uint8>> IcicleQueues;\n    std::map<ObjectGuid, ObjectGuid> IcicleLaunchTargets;\n',
                        '    std::map<ObjectGuid, std::deque<uint8>> IcicleQueues;\n    std::map<ObjectGuid, ObjectGuid> IcicleLaunchTargets;\n    std::recursive_mutex IcicleStateMutex;\n', 1)

          s = s.replace('    void ReconcileIcicleQueue(Player* player)\n    {\n        if (!player)\n            return;\n\n        std::deque<uint8>& queue',
                        '    void ReconcileIcicleQueue(Player* player)\n    {\n        if (!player)\n            return;\n\n        std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n        std::deque<uint8>& queue', 1)

          s = s.replace('    void ClearIcicles(Player* player)\n    {\n        if (!player)\n            return;\n\n        ObjectGuid guid',
                        '    void ClearIcicles(Player* player)\n    {\n        if (!player)\n            return;\n\n        std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n        ObjectGuid guid', 1)

          s = s.replace('    int8 LaunchOldestIcicle(Player* player, Unit* target)\n    {\n        if (!player || !target || !target->IsAlive())\n            return -1;\n\n        ReconcileIcicleQueue(player);',
                        '    int8 LaunchOldestIcicle(Player* player, Unit* target)\n    {\n        if (!player || !target || !target->IsAlive())\n            return -1;\n\n        std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n        ReconcileIcicleQueue(player);', 1)

          s = s.replace('    void StoreIcicle(Player* player, Unit* target, int32 damage)\n    {\n        if (!player || !target || damage <= 0)\n            return;\n\n        ReconcileIcicleQueue(player);',
                        '    void StoreIcicle(Player* player, Unit* target, int32 damage)\n    {\n        if (!player || !target || damage <= 0)\n            return;\n\n        std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n        ReconcileIcicleQueue(player);', 1)

          s = s.replace('            IcicleLaunchTargets[player->GetGUID()] = target->GetGUID();\n',
                        '            {\n                std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n                IcicleLaunchTargets[player->GetGUID()] = target->GetGUID();\n            }\n', 1)

          s = s.replace('            auto itr = IcicleLaunchTargets.find(player->GetGUID());\n',
                        '            std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n            auto itr = IcicleLaunchTargets.find(player->GetGUID());\n', 1)

          s = s.replace('            if (Player* player = GetUnitOwner() ? GetUnitOwner()->ToPlayer() : nullptr)\n                IcicleLaunchTargets.erase(player->GetGUID());\n',
                        '            if (Player* player = GetUnitOwner() ? GetUnitOwner()->ToPlayer() : nullptr)\n            {\n                std::lock_guard<std::recursive_mutex> lock(IcicleStateMutex);\n                IcicleLaunchTargets.erase(player->GetGUID());\n            }\n', 1)

          if '#include <mutex>' not in s or 'IcicleStateMutex' not in s:
              raise SystemExit('Icicle synchronization patch did not apply')
          p.write_text(s)
      - name: Validate patch
        run: |
          git diff --check
          grep -q '#include <mutex>' src/server/scripts/Spells/spell_mastery_icicles.cpp
          grep -q 'recursive_mutex IcicleStateMutex' src/server/scripts/Spells/spell_mastery_icicles.cpp
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mastery-icicles-threadsafe.yml
          git add src/server/scripts/Spells/spell_mastery_icicles.cpp
          git commit -m 'Harden Frost Mage Icicle state synchronization'
          git push origin feature/mastery-core
