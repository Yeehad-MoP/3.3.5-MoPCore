name: One-shot Mastery runtime audit fixes

on:
  push:
    branches: [ feature/mastery-core ]
    paths:
      - 'tools/mastery_runtime_audit_fixes.py'
      - '.github/workflows/mastery-runtime-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Apply audited runtime fixes
        run: python tools/mastery_runtime_audit_fixes.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'EFFECT_0, SPELL_AURA_MOD_DAMAGE_PERCENT_DONE' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'trigger->Id == SPELL_MASTERY_OPPORTUNITY_STRIKE' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'remainingTicks' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'isHunterPet = HasAura(8875)' src/server/game/Entities/Unit/Unit.cpp
          grep -q 'CREATURE_TYPE_DEMON' src/server/game/Entities/Unit/Unit.cpp
          grep -q "102792, 'spell_mastery_harmony_trigger'" data/sql/updates/db_world/2026_09_27_00.sql

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev \
            libmysqlclient-dev libreadline-dev zlib1g-dev libbz2-dev libncurses-dev

      - name: Configure no-PCH audit build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DTOOLS_BUILD=none \
            -DUSE_SCRIPTPCH=OFF \
            -DUSE_COREPCH=OFF \
            -DNOPCH=true \
            -DWITH_WARNINGS=ON

      - name: Compile worldserver
        run: cmake --build build --target worldserver -j2

      - name: Commit fixes and remove temporary audit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/mastery_runtime_audit_fixes.py .github/workflows/mastery-runtime-audit-fixes.yml
          if [ -f .github/workflows/mastery-icicles-compile.yml ]; then
            git rm .github/workflows/mastery-icicles-compile.yml
          fi
          git add src/server/scripts/Spells/spell_mastery.cpp \
                  src/server/game/Entities/Unit/Unit.cpp \
                  data/sql/updates/db_world/2026_09_27_00.sql
          git commit -m 'Fix Mastery runtime audit findings'
          git push origin feature/mastery-core
