name: One-shot Mastery specialization sync

on:
  push:
    branches: [ feature/mastery-core ]
    paths:
      - 'tools/mastery_spec_sync.py'
      - '.github/workflows/mastery-spec-sync.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0

      - name: Apply specialization lifecycle fixes
        run: python tools/mastery_spec_sync.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'GetExpectedMasterySpecializationSpell' src/server/game/Entities/Player/Mastery.h
          grep -q 'TALENT_TREE_DRUID_FERAL_COMBAT' src/server/game/Entities/Player/Mastery.h
          grep -q 'SyncMasterySpecialization(this)' src/server/game/Entities/Unit/StatSystem.cpp
          test "$(grep -c 'SyncMasterySpecialization(this)' src/server/game/Entities/Player/Player.cpp)" -ge 3

      - name: Commit lifecycle fixes and remove temporary audit files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/mastery_spec_sync.py .github/workflows/mastery-spec-sync.yml
          git add src/server/game/Entities/Player/Mastery.h \
                  src/server/game/Entities/Player/Player.cpp \
                  src/server/game/Entities/Unit/StatSystem.cpp
          git commit -m 'Synchronize Mastery passives with active specialization'
          git push origin feature/mastery-core

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev \
            libmysqlclient-dev libreadline-dev zlib1g-dev libbz2-dev libncurses-dev

      - name: Configure no-PCH audit build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSCRIPTS=static \
            -DMODULES=static \
            -DTOOLS_BUILD=none \
            -DUSE_SCRIPTPCH=OFF \
            -DUSE_COREPCH=OFF \
            -DNOPCH=true \
            -DWITH_WARNINGS=ON

      - name: Compile worldserver
        continue-on-error: true
        run: cmake --build build --target worldserver -j2
