name: One-shot tank Mastery coefficient correction
on:
  push:
    branches:
      - feature/mastery-core
    paths:
      - tools/mastery_tank_coeff_patch.py
      - .github/workflows/mastery-tank-coeff-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mastery-core
          fetch-depth: 0
      - name: Apply tank Mastery coefficient corrections
        run: python tools/mastery_tank_coeff_patch.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'GetMastery(player) \* 2.20f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'GetMastery(player) \* 0.50f' src/server/scripts/Spells/spell_mastery.cpp
          grep -q 'spell_mastery_tank.cpp' src/server/scripts/Spells/spell_mastery.cpp
      - name: Commit and clean temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/mastery_tank_coeff_patch.py .github/workflows/mastery-tank-coeff-patch.yml
          git add src/server/scripts/Spells/spell_mastery.cpp
          git commit -m 'Correct MoP tank Mastery coefficients'
          git push origin feature/mastery-core
